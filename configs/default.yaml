# Default configuration for the K-12 pedagogical intelligent agent (PIA).
# Every section maps to one module of the paper (Sections 3.1-3.4, 4.1, 4.5).

language: zh              # zh | en  (classroom deployment in the paper used Chinese)
output_dir: outputs

content:                  # Section 3.1 - text generation
  backend: hf             # hf (LLaMA via transformers) | template (offline, no GPU)
  model_name_or_path: meta-llama/Llama-2-13b-hf
  lora_adapter: null      # path to the LoRA adapter produced by k12agent.content.finetune
  load_in_4bit: true
  max_new_tokens: 1024
  temperature: 0.3
  top_p: 0.9
  knowledge_base: k12agent/content/data/math_kg.json

slides:                   # Section 2.1 - automatic PowerPoint generation
  width_px: 1920
  height_px: 1080
  avatar_box: [0.66, 0.50, 0.30, 0.46]   # x, y, w, h (fractions of the slide), bottom-right as in Fig. 8
  font_cjk: assets/fonts/NotoSansSC-Regular.otf
  formula_dpi: 200

pacing:                   # Section 3.4 (adaptive nonlinear pacing) and Section 4.5.1 (70/110/150 wpm)
  preset: medium          # slow | medium | fast
  wpm: {slow: 70, medium: 110, fast: 150}
  min_dwell_s: 3.0
  max_extra_s: 6.0        # upper bound of the nonlinear extra dwell for dense slides
  density_midpoint: 0.5
  density_slope: 8.0

speech:                   # Section 3.2 - voice cloning / TTS
  backend: rtvc           # rtvc (Real-Time-Voice-Cloning / MockingBird) | dummy
  repo_dir: third_party/Real-Time-Voice-Cloning
  encoder_ckpt: third_party/Real-Time-Voice-Cloning/saved_models/default/encoder.pt
  synthesizer_ckpt: third_party/Real-Time-Voice-Cloning/saved_models/default/synthesizer.pt
  vocoder_ckpt: third_party/Real-Time-Voice-Cloning/saved_models/default/vocoder.pt
  default_voice: assets/voices/default_teacher.wav
  sample_rate: 16000
  similarity_threshold: 0.85            # module-level fidelity criterion (Section 2.3 ii)
  emotional_modulation: true

video:                    # Section 3.3 - Wav2Lip + enhanced SyncNet + DTW
  backend: wav2lip        # wav2lip | none (static avatar)
  repo_dir: third_party/Wav2Lip
  checkpoint: third_party/Wav2Lip/checkpoints/wav2lip_gan.pth
  syncnet_checkpoint: third_party/Wav2Lip/checkpoints/lipsync_expert.pth
  enhanced_checkpoint: null             # checkpoint of k12agent.video.train_enhanced (optional)
  default_face: assets/faces/default_teacher.jpg
  fps: 25
  img_size: 96
  face_det_batch_size: 16
  wav2lip_batch_size: 128
  pads: [0, 10, 0, 0]
  dtw_refine: true
  max_offset_ms: 100                    # lip-sync temporal offset criterion (< 100 ms)

adaptive:                 # Section 4.1.1 - diagnostic & adaptation
  quiz_items: 6
  bands: {low: 0.50, proficient: 0.80}
  mastery_consecutive: 2
  mastery_block_ratio: 0.80

tracking:                 # Section 4.5.1 - off-task monitoring
  enabled: false
  off_task_seconds: 5.0
  camera_index: 0
  log_dir: outputs/logs
